name: Build Android APK (Godot 4)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

env:
  GODOT_VERSION: "4.3"
  GODOT_RELEASE: "stable"

jobs:
  build-android:
    runs-on: ubuntu-latest
    name: 🤖 Build Android APK

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android Build Tools
        run: |
          sdkmanager --install "cmdline-tools;latest" "build-tools;34.0.0" "platforms;android-34"

      - name: Download Godot Headless & Export Templates
        run: |
          mkdir -p ~/.local/share/godot/export_templates/${GODOT_VERSION}.${GODOT_RELEASE}
          mkdir -p ~/godot_bin
          
          echo "Downloading Godot ${GODOT_VERSION} Headless..."
          curl -sSL "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-${GODOT_RELEASE}/Godot_v${GODOT_VERSION}-${GODOT_RELEASE}_linux.x86_64.zip" -o godot.zip
          unzip -q godot.zip -d ~/godot_bin
          mv ~/godot_bin/Godot_v${GODOT_VERSION}-${GODOT_RELEASE}_linux.x86_64 ~/godot_bin/godot
          chmod +x ~/godot_bin/godot
          echo "$HOME/godot_bin" >> $GITHUB_PATH
          
          echo "Downloading Godot Export Templates..."
          curl -sSL "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-${GODOT_RELEASE}/Godot_v${GODOT_VERSION}-${GODOT_RELEASE}_export_templates.tpz" -o templates.tpz
          unzip -q templates.tpz -d /tmp/templates
          mv /tmp/templates/templates/* ~/.local/share/godot/export_templates/${GODOT_VERSION}.${GODOT_RELEASE}/
          rm -rf templates.tpz /tmp/templates godot.zip

      - name: Generate Android Debug Keystore
        run: |
          mkdir -p ~/.android
          keytool -keyalg RSA -genkeypair -alias androiddebugkey -keypass android -keystore ~/.android/debug.keystore -storepass android -dname "CN=Android Debug,O=Android,C=US" -validity 9999 -deststoretype pkcs12

      - name: Configure Godot Android Settings
        run: |
          mkdir -p ~/.config/godot
          echo "export/android/android_sdk_path = \"$ANDROID_HOME\"" >> ~/.config/godot/editor_settings-4.tres
          echo "export/android/debug_keystore = \"$HOME/.android/debug.keystore\"" >> ~/.config/godot/editor_settings-4.tres
          echo "export/android/debug_keystore_user = \"androiddebugkey\"" >> ~/.config/godot/editor_settings-4.tres
          echo "export/android/debug_keystore_pass = \"android\"" >> ~/.config/godot/editor_settings-4.tres

      - name: Export Android APK
        run: |
          mkdir -p export
          godot --headless --export-debug "Android" export/Chamber-Debug.apk

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Chamber-Android-APK
          path: export/Chamber-Debug.apk
          retention-days: 14
